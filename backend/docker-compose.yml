version: "3.7"

x-logging: &fluent-bit
  driver: fluentd
  options:
    fluentd-address: ${FLUENT_BIT_ADDRESS}:24224

services:
  gateway:
    build:
      context: ./gateway/gateway
      dockerfile: Dockerfile
    image: gateway
    container_name: gateway_service
    restart: on-failure
    networks:
      - servers
    ports:
      - 8085:8085
    depends_on:
      - stakeholders
      - blog
      - tours
      - followers
  
  envoy:
    image: envoyproxy/envoy:v1.25.0
    container_name: envoy
    ports:
      - "8087:8087"   
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml
    networks:
      - servers
    depends_on:
      - tours

  
  stakeholders:
    build:
      context: ./stakeholders
      dockerfile: Dockerfile
    image: stakeholder_web_server
    container_name: stakeholder_server
    restart: on-failure
    networks:
      - servers
    ports:
      - 8080:8080
      - 9091:9091
    depends_on:
      database:
        condition: service_healthy
    logging: *fluent-bit
  
  blog:
    build:
      context: ./blog
      dockerfile: Dockerfile
    image: blog_web_server
    container_name: blog_server
    restart: on-failure
    networks:
      - servers
    ports:
      - 8081:8081
    depends_on:
      database:
        condition: service_healthy
    logging: *fluent-bit
  tours:
    build:
      context: ./tours
      dockerfile: Dockerfile
    image: tours_web_server
    container_name: tours_server
    restart: on-failure
    networks:
      - servers
    ports:
      - 8082:8082
    environment:
      - PORT=8082
      - MONGO_DB_URI=mongodb://root:pass@mongo:27017/soadb?authSource=admin
      - JAEGER_ENDPOINT=jaeger:4318
    depends_on:
      mongo:
        condition: service_healthy
      jaeger:
        condition: service_started
    logging: *fluent-bit
  followers:
    build:
      context: ./followers
      dockerfile: Dockerfile
    image: followers_web_server
    container_name: followers_server
    restart: always
    networks:
      - servers
    ports:
      - 8084:8084
    environment:
      - PORT=8084
      - NEO4J_DB=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASS=password123
    depends_on:
      neo4j:
        condition: service_healthy
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - servers


  loki:
    image: grafana/loki:2.9.1
    ports:
      - "3100:3100"
    networks:
      - servers
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_LOG_FILTERS: rendering:debug
    ports:
      - "3000:3000"
    networks:
      - servers
    volumes:
      - grafana-storage:/var/lib/grafana

  
  renderer:
    image: grafana/grafana-image-renderer:3.10.5
    environment:
      ENABLE_METRICS: "true"
    networks:
      - servers
  fluent-bit:
    image: grafana/fluent-bit-plugin-loki:main
    environment:
      - LOKI_URL=http://loki:3100/loki/api/v1/push
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    networks:
      - servers
  jaeger:
    image: jaegertracing/all-in-one:1.48
    ports:
      - "9000:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_OTLP_HTTP_PORT: "4318"
     
    networks:
      - servers
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8086:8080"
    # - "4318:4318"
    networks:
      - servers
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    networks:
      - servers
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)'
  

  database:
    image: mysql:8.0
    container_name: mysql
    restart: always
    networks:
      - servers
    ports:
      - 4000:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: soadb
      MYSQL_ROOT_HOST: '%'
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s
    command: --default-authentication-plugin=mysql_native_password

  # NoSQL: MongoDB
  mongo:
    image: mongo
    restart: always
    networks:
      - servers
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pass
      MONGO_INITDB_DATABASE: soadb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - mongo_store:/data/db

  # NoSQL: Mongo Express (GUI)
  mongo-express:
    image: mongo-express
    restart: always
    networks:
      - servers
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=pass
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
      - ME_CONFIG_MONGODB_URL=mongodb://root:pass@mongo:27017/
    depends_on:
      - mongo
    ports:
      - "8083:8081"
    volumes:
      - mongo_express_data:/data/db
# NoSql Neo4j baza

  neo4j:
    image: neo4j:5.23
    container_name: neo4j
    restart: always
    networks:
      - servers
    ports:
      - "7687:7687"
      - "7474:7474"
      - "7473:7473"   
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_dbms_default__listen__address=0.0.0.0
      - NEO4J_dbms_default__advertised__address=neo4j
      - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
      - NEO4J_dbms_connector_http_listen__address=0.0.0.0:7474
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs


volumes:
  database-data:
    name: server-database
  mongo_store:
  mongo_express_data:
  neo4j_data:
  neo4j_logs:
  grafana-storage:

networks:
  servers:
    name: servers
    driver: bridge
