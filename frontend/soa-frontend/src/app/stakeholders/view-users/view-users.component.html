<div class="users-container">
  <h2>Registered Users</h2>

  <div class="users-grid">
    <mat-card *ngFor="let user of users" class="user-card">
      <mat-card-header>
        <div mat-card-avatar class="user-avatar">
          <mat-icon>person</mat-icon>
        </div>
        <mat-card-title>{{ user.username }}</mat-card-title>
        <mat-card-subtitle>{{ user.role }}</mat-card-subtitle>
      </mat-card-header>

      <mat-divider></mat-divider>

      <mat-card-content>
        <p><mat-icon>email</mat-icon> {{ user.email }}</p>
      </mat-card-content>

      <mat-card-actions>
        <button *ngIf="user.account_status !== 'Blocked'"
                mat-raised-button color="warn"
                (click)="blockUser(user.username)">
          Block
        </button>

        <div *ngIf="user.account_status === 'Blocked'" class="blocked-indicator">
          <mat-icon color="warn">block</mat-icon>
          Blocked
        </div>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
