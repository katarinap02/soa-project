<div class="login-container" style="max-width: 400px; margin: auto; padding: 2rem;">
  <h2>Login</h2>
  <form (ngSubmit)="login()" #loginForm="ngForm">
    <mat-form-field appearance="fill" style="width: 100%; margin-bottom: 1rem;">
      <mat-label>Username</mat-label>
      <input matInput type="text" name="username" [(ngModel)]="username" required />
    </mat-form-field>

    <mat-form-field appearance="fill" style="width: 100%; margin-bottom: 1rem;">
      <mat-label>Password</mat-label>
      <input matInput type="password" name="password" [(ngModel)]="password" required />
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid" style="width: 100%;">
      Login
    </button>
  </form>

  <p *ngIf="errorMessage" style="color:red; margin-top: 1rem;">{{ errorMessage }}</p>
  <p style="margin-top: 1rem; text-align: center;">
    Don't have account? 
    <a routerLink="/register" style="color: #1976d2; text-decoration: none; font-weight: 500;">
      Register
    </a>
  </p>
</div>
