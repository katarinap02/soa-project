 
 <div class="blog-page">
 <button routerLink="/create-blogpost" class="admin-btn">
    Create post
  </button>
<div class="blog-grid">

     
  <mat-card *ngFor="let post of posts" class="blog-card">
    <mat-card-header>
      <mat-card-title>{{ post.title }}</mat-card-title>
      <mat-card-subtitle>
        {{ post.username }} • {{ post.date | date:'medium' }}
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p>{{ post.description }}</p>
    </mat-card-content>

    <mat-card-actions>
      <button mat-button color="primary">READ MORE</button>
    </mat-card-actions>
  </mat-card>
</div>

</div>
