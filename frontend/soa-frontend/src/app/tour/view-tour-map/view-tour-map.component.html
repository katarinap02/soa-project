<div class="container">
      <div id="map" style="height: 400px; margin-bottom: 20px;"></div>

      <div class="keypoint-data">


  <form class="keypoint-form" (ngSubmit)="addKeyPoint()">
      <h2>Add Key Point to Tour</h2>
    <mat-form-field class="full-width">
      <mat-label>Name</mat-label>
      <input matInput [(ngModel)]="keyPoint.name" name="name" required>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput [(ngModel)]="keyPoint.description" name="description"></textarea>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Image URL</mat-label>
      <input matInput [(ngModel)]="keyPoint.imageUrl" name="imageUrl">
    </mat-form-field>

    <p>Click on the map to select location:</p>
  

    <button mat-raised-button color="primary" type="submit">Add Key Point</button>
  </form>

  <div class="table-div">
  <h3>Existing Key Points</h3>
  <table mat-table [dataSource]="keyPoints" class="mat-elevation-z8 full-width">

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let kp"> {{kp.name}} </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef> Description </th>
      <td mat-cell *matCellDef="let kp"> {{kp.description}} </td>
    </ng-container>

    
    <ng-container matColumnDef="latitude">
      <th mat-header-cell *matHeaderCellDef> Latitude </th>
      <td mat-cell *matCellDef="let kp"> {{kp.latitude}} </td>
    </ng-container>
        <ng-container matColumnDef="longitude">
      <th mat-header-cell *matHeaderCellDef> Longitude </th>
      <td mat-cell *matCellDef="let kp"> {{kp.longitude }} </td>
    </ng-container>

        <ng-container matColumnDef="edit">
      <th mat-header-cell *matHeaderCellDef>  </th>
      <td mat-cell *matCellDef="let kp"> <button mat-button>Edit</button></td>
    </ng-container>

        <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef>  </th>
      <td mat-cell *matCellDef="let kp"> <button mat-button>Delete</button> </td>
    </ng-container>

    

    <tr mat-header-row *matHeaderRowDef="['name', 'description', 'latitude', 'longitude', 'edit', 'delete']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['name', 'description', 'latitude', 'longitude', 'edit', 'delete'];"></tr>
  </table>
  </div>
  </div>
</div>
