
<h2 class="profile-title">My Profile</h2>

<div class="grid-container" *ngIf="userProfile">

  <!-- Profil -->
  <mat-card class="profile-card">
    <mat-card-header>
      <div mat-card-avatar class="profile-avatar">
        <img
  [src]="userProfile.profilePicture || DEFAULT_AVATAR"
  (error)="onImgError($event)"
  alt="avatar"
  class="avatar-img"
/>
      </div>
      <mat-card-title>{{ userProfile.firstName }} {{ userProfile.lastName }}</mat-card-title>
      <mat-card-subtitle>{{ userProfile.motto }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>{{ userProfile.biography }}</p>
    </mat-card-content>
  </mat-card>

  <!-- Following -->
  <mat-card class="profile-card">
    <mat-card-header>
      <mat-card-title>Following</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div *ngFor="let f of following" class="mini-profile">
        <img
  [src]="f.profilePicture || DEFAULT_AVATAR"
  (error)="onImgError($event)"
  alt="avatar"
  class="avatar-img-mini"
/>
        {{ f.firstName }} {{ f.lastName }}

        <button
  *ngIf="f.id !== userProfile?.id"
  mat-button
  color="primary"
  (click)="toggleFollow(f)"
>
  {{ isFollowing(f.id) ? 'Unfollow' : 'Follow' }}
</button>
        
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Followers -->
  <mat-card class="profile-card">
    <mat-card-header>
      <mat-card-title>Followers</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div *ngFor="let f of followers" class="mini-profile">
        <img
  [src]="f.profilePicture || DEFAULT_AVATAR"
  (error)="onImgError($event)"
  alt="avatar"
  class="avatar-img-mini"
/>

        {{ f.firstName }} {{ f.lastName }}

        <button
  *ngIf="f.id !== userProfile?.id"
  mat-button
  color="primary"
  (click)="toggleFollow(f)"
>
  {{ isFollowing(f.id) ? 'Unfollow' : 'Follow' }}
</button>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Recommendations -->
  <mat-card class="profile-card">
    <mat-card-header>
      <mat-card-title>Recommendations</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div *ngFor="let r of recommendations" class="mini-profile">
        <img
  [src]="r.profilePicture || DEFAULT_AVATAR"
  (error)="onImgError($event)"
  alt="avatar"
  class="avatar-img-mini"
/>
        {{ r.firstName }} {{ r.lastName }}

        <button
  *ngIf="r.id !== userProfile?.id"
  mat-button
  color="primary"
  (click)="toggleFollow(r)"
>
  {{ isFollowing(r.id) ? 'Unfollow' : 'Follow' }}
</button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
